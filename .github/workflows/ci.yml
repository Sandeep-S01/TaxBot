name: TaxBot Backend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check mojibake
        run: npm run check:mojibake

      - name: Check frontend safety
        run: npm run check:frontend-safety

      - name: Check public assets
        run: npm run check:public-assets

      - name: Check diagnostic script safety
        run: npm run check:script-safety

      - name: Check Render deployment config
        run: npm run check:render-config

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t taxbot-ci .
